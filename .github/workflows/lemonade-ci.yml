name: OnePlus 9 build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lemonade-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-tests:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fetch pinned userland
        run: python3 tools/ci/checkout-userland.py
      - name: Install sanitizer runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-rt-18-dev
      - name: Test production display, exit and transport code
        run: |
          set -euo pipefail
          for suite in display-composite display-pipeline display-fences display-resume display-stop gpu-return dma-pool refresh base usb wifi check-direct check-display check-fences check-ios-refresh check-refresh network verify-android; do
            python3 "tools/test-lemonade-${suite}.py"
          done
          python3 tools/test-lemonade-ci.py
          bash tools/test-lemonade-bluetooth.sh
          python3 userland/tests/test_jb_setid_manifest.py
          clang -Wall -Wextra -Werror -Ixnu/files/bsd/dev tools/test-lemonade-touch.c -o /tmp/touch-test
          /tmp/touch-test
          clang -Wall -Wextra -Werror -Ixnu/files/bsd/dev tools/test-lemonade-mhi.c -o /tmp/mhi-test
          /tmp/mhi-test
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tools/test-lemonade-battery.c xnuloader/lemonade_battery.c -o /tmp/battery-test
          /tmp/battery-test
          python3 tools/test-lemonade-battery-service.py

  metal-tests:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fetch pinned userland
        run: python3 tools/ci/checkout-userland.py
      - name: Test Metal ownership and asynchronous completion
        run: |
          python3 tools/test-lemonade-metal-lifetime.py
          python3 tools/test-lemonade-metal-completion.py
          bash tools/test-lemonade-bluetooth.sh

  build:
    needs: [linux-tests, metal-tests]
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      THEOS: /tmp/lemonade-theos
      JOBS: '4'
      LEMONADE_CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang lld llvm uuid-dev liblz4-dev pkg-config cmake rsync unzip git ca-certificates gawk flex bison m4 autoconf automake libtool libxml2-dev libssl-dev libncurses-dev zlib1g-dev libzstd-dev python3-venv python3-dev python3-setuptools meson ninja-build curl xz-utils patch
      - name: Fetch pinned userland
        run: python3 tools/ci/checkout-userland.py
      - name: Compile and package generic components
        run: bash tools/ci/build-lemonade.sh

  publish:
    needs: [linux-tests, metal-tests]
    if: github.repository == 'b1ackm4x/hackios-xnu-kernel' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      THEOS: /tmp/lemonade-theos
      JOBS: '4'
      LEMONADE_CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang lld llvm uuid-dev liblz4-dev pkg-config cmake rsync unzip git ca-certificates gawk flex bison m4 autoconf automake libtool libxml2-dev libssl-dev libncurses-dev zlib1g-dev libzstd-dev python3-venv python3-dev python3-setuptools meson ninja-build curl xz-utils patch
      - name: Fetch pinned userland
        run: python3 tools/ci/checkout-userland.py
      - name: Compile and package generic components
        run: bash tools/ci/build-lemonade.sh
      - name: Publish commit-specific prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tools/ci/publish-release.py
