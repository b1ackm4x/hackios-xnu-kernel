# OnePlus 9 LE2110. Early loader bring-up; see docs/LEMONADE.md.
NAME="OnePlus 9 LE2110 (lemonade)"
KIND=phone
SOC="Qualcomm Snapdragon 888 (SM8350)"

UEFI_TARGET=lemonade
UEFI_FD=Mu-Silicium/Build/lemonadePkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd
# The device's FDT with runtime /chosen data removed by lemonade-prepare.py.
DTB=local/lemonade/boot.dtb
FD_BASE=0x9FD00000
FD_SIZE=0x200000
PAYLOAD_BASE=0xF0000000
BOOT_HEADER_VERSION=3

# Expected GOP base from lemonadePkg; must be checked on this physical phone.
FB_BASE=0xE4D00000
WIFI_ATH11K=0
# No SM7325 peripheral drivers or flash persistence during initial bring-up.
BOOTARGS="-v cpus=1 touchscreen=0 buttons=0 cpufreq=0 gpu=0 wifi=0 adsp=0 ufs=0 ufs_native=0 ufs_write=0 var_store=0"
DEFAULT_SECS=8
USERLAND_VARS="PREBUILT=1 GL= SHARE=1 RC_JOBS=../devices/oneplus-9/lemonade.rc.jobs"
FIRMWARE=""
